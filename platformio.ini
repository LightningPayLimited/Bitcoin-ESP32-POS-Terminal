; ============================================================
; Stacked POS — ESP32-P4-Function-EV-Board
; ============================================================
; Built-in 7" 1024x600 MIPI-DSI display (EK79007) + GT911 touch.
; TCA9554 I2C IO expander handles LCD/TP reset lines.
; WiFi via ESP-Hosted to onboard ESP32-C6-MINI-1.
;
; WiFi / API key are stored in NVS, provisioned via captive portal.

[platformio]
src_dir = .
include_dir = .

[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
board_build.partitions = default_16MB.csv

; src_dir is the project root, so the default glob also pulls lib/*.cpp into
; the main build *and* compiles it as a library → duplicate symbols. Exclude
; lib/ from the source glob; the LDF still builds it as a library.
build_src_filter = +<*> -<lib/>

monitor_speed = 115200
; 115200 = connect at the target speed, so esptool skips the "Changing baud
; rate to 921600" step that wedges this board's native USB-Serial/JTAG. The
; baud is nominal over USB anyway, so the higher rate gained nothing.
upload_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    ricmoo/QRCode@^0.0.1
    bblanchon/ArduinoJson@^7.0.0
    tamctec/TAMC_GT911@^1.0.2
    adafruit/Adafruit Thermal Printer Library@^1.4.0
