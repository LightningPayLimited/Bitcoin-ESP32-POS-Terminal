; ============================================================
; Lightning Pay POS — ESP32-S3 variant
; 2.8" lcdwiki board: ILI9341V 240x320 SPI + FT6336 cap touch.
; Separate fork of the ESP32-P4 POS (native WiFi, smaller screen).
; ============================================================
[platformio]
src_dir = .
include_dir = .

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16MB QIO flash + 8MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; src_dir is the project root, so the default glob also pulls lib/*.cpp into
; the main build *and* compiles it as a library -> duplicate symbols. Exclude
; lib/ from the source glob; the LDF still builds it as a library.
build_src_filter = +<*> -<lib/>

; Board uses the ESP32-S3 native USB-Serial/JTAG (lsusb: 303a:1001) → ttyACM*.
; Pinned so auto-detect can't grab /dev/ttyS0.
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
upload_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    ; Route Arduino Serial to the native USB-Serial/JTAG CDC (HWCDC) so
    ; Serial.println shows on /dev/ttyACM*. Without these it goes to UART0.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    bblanchon/ArduinoJson@^7.0.0
    ricmoo/QRCode@^0.0.1
