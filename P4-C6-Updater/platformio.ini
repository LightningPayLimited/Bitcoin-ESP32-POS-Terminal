; ============================================================
; ESP32-C6 co-processor firmware updater for ESP32-P4-Function-EV-Board.
; One-shot: streams the embedded esp_hosted 2.12.3 C6 image to the C6 over
; SDIO (no WiFi needed), then activates it. Flash this, run once, then
; reflash the normal POS firmware.
; ============================================================
[platformio]
src_dir = .
include_dir = .

[env:esp32p4-c6updater]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs   ; the C6 image lives in the spiffs partition

upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
upload_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=3            ; show the hosted/SDIO init + version logs
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
